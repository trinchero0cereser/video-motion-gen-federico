  <script>
    const tl = gsap.timeline({ paused: true });
    const OFFSET = 4; // la barra entra a 4 s del film: il timecode mostra il tempo del film
    const tc = document.getElementById("vbr-tc");
    const pad = (n) => String(n).padStart(2, "0");
    function paint() {
      const f = Math.round((tl.time() + OFFSET) * 30);
      const s = Math.floor(f / 30);
      tc.textContent = "TC 00:00:" + pad(s) + ":" + pad(f % 30);
    }
    // la linea si traccia da sinistra quando la barra arriva
    tl.fromTo("#vbr-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0);
    tl.fromTo(".vbr-txt", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 0.3);
    tl.to({}, { duration: 36 }, 0);
    tl.eventCallback("onUpdate", paint);
    paint();
    window.__timelines["vbar"] = tl;
  </script>
