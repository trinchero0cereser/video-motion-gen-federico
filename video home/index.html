<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Vellum Studio — showcase 16:9</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: #000000;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-9rbe"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <!-- 0–4 s · ingresso del logo -->
      <div data-hf-id="hf-c5ur"
        id="logo"
        data-composition-id="logo"
        data-composition-src="compositions/logo.html"
        data-start="0"
        data-duration="4.1"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <!-- 3.5–9.8 s · titolo, home 03, le L si aprono -->
      <div data-hf-id="hf-j3n2"
        id="open"
        data-composition-id="open"
        data-composition-src="compositions/open.html"
        data-start="3.5"
        data-duration="6.3"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <!-- 9–20 s · progetti (05) e servizi (06) -->
      <div data-hf-id="hf-ryo1"
        id="projects"
        data-composition-id="projects"
        data-composition-src="compositions/projects.html"
        data-start="9"
        data-duration="11.7"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
      <!-- 19.5–28 s · metodo (07), domande (08), telefono (10, 11) -->
      <div data-hf-id="hf-2hrw"
        id="method"
        data-composition-id="method"
        data-composition-src="compositions/method.html"
        data-start="19.5"
        data-duration="9.2"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>
      <!-- 27.5–35 s · preventivo (09) -->
      <div data-hf-id="hf-4dpz"
        id="quote"
        data-composition-id="quote"
        data-composition-src="compositions/quote.html"
        data-start="27.5"
        data-duration="8.2"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 5"
      ></div>
      <!-- 34.5–40 s · chiusura -->
      <div data-hf-id="hf-okcs"
        id="outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="34.5"
        data-duration="5.5"
        data-track-index="6"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 6"
      ></div>
      <!-- 4–40 s · barra con il timecode -->
      <div data-hf-id="hf-hr0b"
        id="bar"
        data-composition-id="bar"
        data-composition-src="compositions/bar.html"
        data-start="4"
        data-duration="36"
        data-track-index="7"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 10"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
